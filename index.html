<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de photos interactive</title>
    <script src="gallery.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
    <h1>Galerie de photos</h1>
    <div id="image" aria-live="polite">Hover over an image below to display here.</div>
    <div id="gallery">
        <img src="https://plus.unsplash.com/premium_photo-1673967831980-1d377baaded2?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="A black and white border collie standing on"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="http://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="A golden retriever puppy sitting on a stone patio"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://images.unsplash.com/photo-1592194996308-7b43878e84a6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="A black and white border collie with its mouth open and ears up"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://plus.unsplash.com/premium_photo-1667030474693-6d0632f97029?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="A white dog with black patches "
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://images.unsplash.com/photo-1764708844823-00d2188dafd8?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="A golden retriever with its tongue out"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">
        <img src="https://images.unsplash.com/photo-1774876267601-501fa7d17ac7?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="Golden Dog retriever out."
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

    </div>
</main>

</body>

</html>
